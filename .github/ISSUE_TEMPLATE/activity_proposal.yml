name: Proposer une activité
description: Proposer un challenge, un atelier, un tech talk, une session ou un hackathon
title: "[ACTIVITY] "
labels: ["activity", "status: triage"]
body:
  - type: input
    id: name
    attributes:
      label: Nom de l'activité
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Challenge, Atelier, Tech talk, Session de révision, Hackathon, Événement]
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Objectifs
      description: Ce que les participants vont apprendre ou réaliser
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Niveau
      options: [Débutant, Intermédiaire, Avancé, Tous niveaux]
  - type: dropdown
    id: format
    attributes:
      label: Format
      options: [Discord vocal, Présentiel, Hybride]
  - type: input
    id: date
    attributes:
      label: Date ou période souhaitée
      description: Avec fuseau horaire
  - type: checkboxes
    id: organizer
    attributes:
      label: Organisation
      options:
        - label: Je suis volontaire pour organiser cette activité.
